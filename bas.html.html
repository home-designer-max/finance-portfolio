
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #F8F5EC;
    min-height: 100vh;
    font-family: Arial, sans-serif;
}

.grid {
    width: 60vw;
    height: 60vh;
    margin: 25vh auto 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 15px;
}

.grid button {
    border: none;
    border-radius: 12px;
    background-color: #383838;
    color: #FFFFFF;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.grid button:hover {
    background-color: #505050;
}

@media (max-width: 600px) {
    .grid {
        width: 85vw;
        height: 60vh;
        margin-top: 25vh;
    }
}
</style>
</head>

<body>

<div class="grid">
    <button type="button" onclick="window.location.href='retirewell_planner.html'">Retirement Planner</button>
    <button>Button 2</button>
    <button>Button 3</button>
    <button>Button 4</button>
</div>

</body>
</html>
